name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: pnpm/action-setup@v6.1.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - name: Cache Turborepo
        uses: actions/cache@v6.1.0
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - run: pnpm install --frozen-lockfile

      - name: Create Release PR or Publish
        id: changesets
        uses: changesets/action@v2.1.2
        with:
          version-script: pnpm run version
          publish-script: pnpm release
          # GitHub refuses a release body over 125,000 characters and changesets/action sends each
          # CHANGELOG section whole; the step below cuts at an entry boundary instead.
          create-github-releases: false
          # The step below reads each CHANGELOG at its tag, so the tags must be on GitHub first.
          push-git-tags: true
          push-with-git-cli: true

      - name: Create GitHub Releases
        if: steps.changesets.outputs.published == 'true'
        run: node .github/scripts/github-release.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISHED_PACKAGES: ${{ steps.changesets.outputs.published-packages }}
