name: Bundle size

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: bundle-size-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  bundle-size:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Find the base
        id: base
        run: echo "sha=$(git rev-parse HEAD^1)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.base.outputs.sha }}
          path: .bundle-size-base
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build head
        run: pnpm --filter @kumikijs/runtime build

      - name: Measure head
        run: node packages/benchmarks/bundle-size/measure.mjs --out "$RUNNER_TEMP/head.json"

      - name: Build base
        working-directory: .bundle-size-base
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @kumikijs/runtime build

      - name: Measure base
        continue-on-error: true
        run: node packages/benchmarks/bundle-size/measure.mjs --root .bundle-size-base --out "$RUNNER_TEMP/base.json"

      - name: Compare
        run: |
          node packages/benchmarks/bundle-size/compare.mjs "$RUNNER_TEMP/base.json" "$RUNNER_TEMP/head.json" > "$RUNNER_TEMP/bundle-size.md"
          cat "$RUNNER_TEMP/bundle-size.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Comment on the PR
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require("node:fs");
            const body = fs.readFileSync(`${process.env.RUNNER_TEMP}/bundle-size.md`, "utf8");
            const marker = "<!-- kumiki-bundle-size -->";
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
            });
            const mine = comments.find(
              (c) => c.user?.login === "github-actions[bot]" && c.body?.startsWith(marker),
            );
            if (mine) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
