name: Bundle size

# What each example app ships, on the PR's merge commit against its base:
# `kumiki build --bundle` and `--minify`, raw / gzip / brotli. Informational —
# the gate on size stays the counter budget in packages/cli/test/cli.test.ts;
# this shows every app, and by how much a PR moves it, before it reaches that
# line. See packages/benchmarks/bundle-size/.

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: bundle-size-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  bundle-size:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          # The base commit has to be in the clone for the worktree below.
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build head
        run: pnpm build

      - name: Measure head
        run: node packages/benchmarks/bundle-size/measure.mjs --out "$RUNNER_TEMP/head.json"

      # The base is measured with the head's script but the base's own CLI and
      # runtime (`--root`), so the two reports differ only by the PR's change.
      - name: Build base
        run: |
          git worktree add "$RUNNER_TEMP/base" "$BASE_SHA"
          cd "$RUNNER_TEMP/base"
          pnpm install --frozen-lockfile
          pnpm build

      - name: Measure base
        run: node packages/benchmarks/bundle-size/measure.mjs --root "$RUNNER_TEMP/base" --out "$RUNNER_TEMP/base.json"

      - name: Compare
        run: |
          node packages/benchmarks/bundle-size/compare.mjs "$RUNNER_TEMP/base.json" "$RUNNER_TEMP/head.json" > "$RUNNER_TEMP/bundle-size.md"
          cat "$RUNNER_TEMP/bundle-size.md" >> "$GITHUB_STEP_SUMMARY"

      # A fork's token cannot write to the PR; the job summary above still has
      # the table there.
      - name: Comment on the PR
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require("node:fs");
            const body = fs.readFileSync(`${process.env.RUNNER_TEMP}/bundle-size.md`, "utf8");
            const marker = "<!-- kumiki-bundle-size -->";
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
            });
            const mine = comments.find(
              (c) => c.user?.type === "Bot" && c.body?.startsWith(marker),
            );
            if (mine) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
