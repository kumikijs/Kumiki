name: Bundle size

# What each example app ships, on the PR's merge commit against its base:
# `kumiki build --bundle` and `--minify`, raw / gzip / brotli. Informational —
# the gate on size stays the counter budget in packages/cli/test/cli.test.ts;
# this shows every app, and by how much a PR moves it, before it reaches that
# line. See packages/benchmarks/bundle-size/.

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: bundle-size-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  bundle-size:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      # Neither checkout keeps its token in .git/config: this job's token can
      # write to the PR, and `pnpm install` / `pnpm build` run the checked-out
      # code. The comment step gets the token from github-script instead.
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      # The base goes in its own shallow checkout — one commit, not the
      # history — and is measured with the head's script but its own CLI and
      # runtime (`--root`), so the two reports differ only by the PR's change.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .bundle-size-base
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `kumiki build` copies the runtime's prebuilt dist/modules; the CLI and
      # compiler run from src through tsx, so the runtime is all either side
      # needs built.
      - name: Build head
        run: pnpm --filter @kumikijs/runtime build

      - name: Measure head
        run: node packages/benchmarks/bundle-size/measure.mjs --out "$RUNNER_TEMP/head.json"

      - name: Build base
        working-directory: .bundle-size-base
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @kumikijs/runtime build

      - name: Measure base
        run: node packages/benchmarks/bundle-size/measure.mjs --root .bundle-size-base --out "$RUNNER_TEMP/base.json"

      - name: Compare
        run: |
          node packages/benchmarks/bundle-size/compare.mjs "$RUNNER_TEMP/base.json" "$RUNNER_TEMP/head.json" > "$RUNNER_TEMP/bundle-size.md"
          cat "$RUNNER_TEMP/bundle-size.md" >> "$GITHUB_STEP_SUMMARY"

      # A fork's token cannot write to the PR; the job summary above still has
      # the table there.
      - name: Comment on the PR
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require("node:fs");
            const body = fs.readFileSync(`${process.env.RUNNER_TEMP}/bundle-size.md`, "utf8");
            const marker = "<!-- kumiki-bundle-size -->";
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
            });
            const mine = comments.find(
              (c) => c.user?.login === "github-actions[bot]" && c.body?.startsWith(marker),
            );
            if (mine) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
