name: GitHub Release

on:
  workflow_dispatch:
    inputs:
      tags:
        description: "Space-separated tags, e.g. @kumikijs/compiler@0.14.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  github-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Create GitHub Releases
        run: node .github/scripts/github-release.mjs $TAGS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAGS: ${{ inputs.tags }}
